      // Mavzuni birinchi kadrdayoq qo'llash (oq "miltillash" bo'lmasin)

        var t = JSON.parse(localStorage.getItem('crm-theme') || 'null');
        document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {}
    </script>
